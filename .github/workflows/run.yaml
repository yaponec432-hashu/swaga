name: Progrev hammama
on:
  workflow_dispatch:
  schedule:
    - cron: "40 * * * *"

permissions:
  contents: read

concurrency:
  group: hammam
  queue: max

jobs:
  burmalda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@7

      - name: Install uv
        uses: astral-sh/setup-uv@10.3.2
        with:
          python-version: "3.15"
          cache-python: "true"

      - name: Install ffmpeg
        uses: awalsh128/cache-apt-pkgs-action@1.6.3
        with:
          packages: ffmpeg
          version: 1.0

      - name: Vernite mamu pticu
        run: uv run ./main.py
        env:
          CHEMODAN: ${{ secrets.CHEMODAN }}
          SYNC: 0
