#yml
name: Progrev hammama
on:
  schedule:
    - cron: "44 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  burmalda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"

      - name: Install pkgs
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg
          python3 -m pip install uv

      - name: Vernite mamu pticu
        run: |
          uv run ./main.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          BOT_SYNC_ENABLED: 0
