name: t
on:
  pull_request

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: bash -c "$(curl -f https://releases.astral.sh/installers/uv/latest/uv-installer.sh)"
