name: t
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the bots
        run: |
          uv run ./main.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          COOKIES: ${{ secrets.COOKIES }}
          BOT_SYNC_ENABLED: 1
