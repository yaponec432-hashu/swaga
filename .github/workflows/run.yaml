name: Run the bots
on:
  schedule:
    - cron: '39 23,1,3,5,8,11,13,15,19,21 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: bash -c "$(curl -f https://releases.astral.sh/installers/uv/latest/uv-installer.sh)"

      - name: Run the bots
        run: |
          uv run ./master.py &
          uv run ./slave.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          SLAVE_TOKEN: ${{ secrets.SLAVE_TOKEN }}
          MASTER_ID: ${{ vars.MASTER_ID }}
          BOT_SYNC_ENABLED: 0
