#yml
name: Progrev hammama
on:
  workflow_dispatch:
  schedule:
    - cron: "44 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  burmalda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install pkgs
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg
          python3 -m pip install uv

      - name: Check pending
        run: |
          pending="$(gh api repos/${REPO}/actions/workflows/run.yaml/runs?status=pending --jq '.total_count // 0')"
          if ((pending < 2)); then
            echo 'ok=true' >> "${GITHUB_ENV}"
          else
            echo 'ok=false' >> "${GITHUB_ENV}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Vernite mamu pticu
        if: env.ok
        run: uv run ./main.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          BOT_SYNC_ENABLED: 0
