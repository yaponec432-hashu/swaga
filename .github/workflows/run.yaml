#yml
name: Progrev hammama
on:
  workflow_dispatch:
  schedule:
    - cron: "44 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  burmalda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install ffmpeg
        # v1.6.3
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: ffmpeg
          version: 1.0

      - name: Install pkgs
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg
          python3 -m pip install uv

      - name: Vernite mamu pticu
        run: uv run ./main.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          BOT_SYNC_ENABLED: 0
