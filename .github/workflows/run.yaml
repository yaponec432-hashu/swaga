name: Progrev hammama
on:
  schedule:
    - cron: '44 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  burmalda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Run the bots
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg
          uv run ./main.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          BOT_SYNC_ENABLED: 0
