#yml
name: Progrev hammama
on:
  workflow_dispatch:
  schedule:
    - cron: "44 * * * *"

concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: read

jobs:
  burmalda:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        # v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.15"
          cache-python: "true"
          version: "0.13.5"

      - name: Install ffmpeg
        # v1.6.3
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: ffmpeg
          version: 1.0

      - name: Vernite mamu pticu
        run: sudo apt update >/dev/null; apt search ^ffmpeg #uv run ./main.py
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
          BOT_SYNC_ENABLED: 0
