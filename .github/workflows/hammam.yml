---
name: Progrev hammama
on:
  schedule:
    - cron: '21 21,2,7,11,16 * * *'

permissions:
  contents: read

concurrency:
  group: hammam
  queue: max

jobs:
  hammam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.15'
          cache-python: 'true'

      - name: Install ffmpeg
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ffmpeg
          version: 1.0

      - name: Vernite mamu pticu
        run: uv run ./burmalda.py
        env:
          CHEMODAN: ${{ secrets.CHEMODAN }}
          SYNC: 0
...
